# Builds the Windows installer from the tagged source on GitHub's runners and
# publishes it with SHA-256 checksums and a build-provenance attestation, so
# anyone can verify the installer was built from this repository:
#   gh attestation verify <installer.exe> -R nyakojiru/llm-usage-overlay
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation (Sigstore, keyless)
  attestations: write  # store the attestation

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Build installer
        run: |
          npm ci
          npm run build

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          # A name without spaces: GitHub would rename spaces to dots on upload,
          # and SHA256SUMS.txt must match the published name.
          $ver = "${{ github.ref_name }}".TrimStart("v")
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Copy-Item -Destination "dist/llm-usage-overlay_${ver}_x64-setup.exe"
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: .github/release-notes.md
          generate_release_notes: true
