[package]
name = "llm-usage-overlay"
version = "0.1.0"
description = "Tiny always-on-top Windows overlay showing LLM provider spend and plan limits"
license = "MIT"
repository = "https://github.com/nyakojiru/llm-usage-overlay"
edition = "2021"

[lib]
name = "llm_usage_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
