<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM Usage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="frame">
    <header data-tauri-drag-region>
      <span class="title" data-tauri-drag-region data-i18n="title">LLM usage</span>
      <span id="status" data-tauri-drag-region></span>
      <button id="btn-compact" data-i18n-title="btn.compact">▭</button>
      <button id="btn-refresh" data-i18n-title="btn.refresh">↻</button>
      <button id="btn-settings" data-i18n-title="btn.settings">⚙</button>
      <button id="btn-hide" data-i18n-title="btn.hide">✕</button>
    </header>

    <main id="view-usage"></main>

    <section id="view-settings" hidden>
      <h2 data-i18n="accounts">Accounts</h2>
      <ul id="account-list"></ul>

      <form id="add-form">
        <h2 data-i18n="add.title">Add account</h2>
        <label><span data-i18n="add.provider">Provider</span>
          <select name="provider" id="provider">
            <option value="claude_web" data-i18n="p.claude_web"></option>
            <option value="chatgpt_web" data-i18n="p.chatgpt_web"></option>
            <option value="opencode_web" data-i18n="p.opencode_web"></option>
            <option value="anthropic" data-i18n="p.anthropic"></option>
            <option value="openai" data-i18n="p.openai"></option>
          </select>
        </label>
        <label><span data-i18n="add.label">Name</span> <input name="label" data-i18n-ph="add.label.ph" /></label>
        <label id="row-secret"><span data-i18n="add.key">Admin key</span> <input name="secret" type="password" autocomplete="off" /></label>
        <label id="row-budget"><span data-i18n="add.budget">Monthly budget</span> <input name="budget_month" type="number" min="0" step="1" /></label>
        <p id="hint" class="hint"></p>
        <button type="submit" data-i18n="add.submit">Add</button>
        <p id="form-error" class="err"></p>
      </form>

      <label class="check"><input id="alerts" type="checkbox" /> <span data-i18n="alerts"></span></label>
      <button type="button" class="link" id="test-alert" data-i18n="alerts.test"></button>
      <label class="check"><input id="autostart" type="checkbox" /> <span data-i18n="autostart"></span></label>
      <label class="inline"><span data-i18n="language">Language</span>
        <select id="language">
          <option value="auto" data-i18n="language.auto"></option>
          <option value="en">English</option>
          <option value="es">Español (Latinoamérica)</option>
        </select>
      </label>
      <label class="inline"><span data-i18n="refresh">Refresh every</span>
        <input id="refresh" type="number" min="60" step="30" /> s
      </label>
      <p class="hint" data-i18n="shortcuts"></p>
    </section>

    <div id="grip" data-i18n-title="grip"></div>
  </div>
  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
