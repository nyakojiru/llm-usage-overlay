<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM Usage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="frame">
    <header data-tauri-drag-region>
      <span class="title" data-tauri-drag-region>LLM usage</span>
      <span id="status" data-tauri-drag-region></span>
      <button id="btn-compact" title="Compact / full (double-click header)">▭</button>
      <button id="btn-refresh" title="Refresh now">↻</button>
      <button id="btn-settings" title="Accounts">⚙</button>
      <button id="btn-hide" title="Hide (Ctrl+Alt+H)">✕</button>
    </header>

    <main id="view-usage"></main>

    <section id="view-settings" hidden>
      <h2>Accounts</h2>
      <ul id="account-list"></ul>

      <form id="add-form">
        <h2>Add account</h2>
        <label>Provider
          <select name="provider" id="provider">
            <option value="claude_web">Claude plan (Pro/Max)</option>
            <option value="chatgpt_web">ChatGPT plan (Plus/Pro)</option>
            <option value="opencode_web">OpenCode (Go / Zen)</option>
            <option value="anthropic">Anthropic API spend</option>
            <option value="openai">OpenAI API spend</option>
          </select>
        </label>
        <label>Label <input name="label" placeholder="e.g. Personal Max" /></label>
        <label id="row-secret">Key <input name="secret" type="password" autocomplete="off" placeholder="admin key" /></label>
        <label id="row-budget">Monthly budget, USD (optional) <input name="budget_month" type="number" min="0" step="1" /></label>
        <p id="hint" class="hint"></p>
        <button type="submit">Add</button>
        <p id="form-error" class="err"></p>
      </form>

      <label class="check"><input id="alerts" type="checkbox" /> Notify me at 80 % / 95 % of a limit, when I'm on pace to hit one, and at 80 % / 100 % of a budget</label>
      <button type="button" class="link" id="test-alert">Send a test notification</button>
      <label class="check"><input id="autostart" type="checkbox" /> Start with Windows</label>
      <label class="inline">Refresh every
        <input id="refresh" type="number" min="60" step="30" /> s
      </label>
      <p class="hint">Ctrl+Alt+U: click-through on/off · Ctrl+Alt+H: show/hide</p>
    </section>

    <div id="grip" title="Resize"></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
